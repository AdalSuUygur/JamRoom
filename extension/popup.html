<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 250px; font-family: sans-serif; padding: 15px; text-align: center; }
    h3 { color: #ff0000; margin-top: 0; }
    input { width: 90%; padding: 8px; margin-bottom: 10px; }
    button { width: 100%; padding: 10px; border: none; border-radius: 4px; cursor: pointer; margin-top: 5px; font-weight: bold; }
    #joinBtn  { background-color: #ff0000; color: white; }
    #leaveBtn { background-color: #333;    color: white; }

    /* Share button — visible only when in a room */
    #shareBtn {
      background-color: #1a73e8;
      color: white;
      transition: background-color 0.2s ease;
    }

    /* Copied feedback state — green confirms success */
    #shareBtn.btn--copied {
      background-color: #188038;
    }

    /* Hidden utility — toggled by updateShareVisibility() in popup.js */
    .hidden { display: none !important; }

    /* Member list — grows with content, scrolls after 120px */
    #memberList {
      margin-top: 12px;
      text-align: left;
      max-height: 120px;
      overflow-y: auto;
    }

    .member-item {
      font-size: 13px;
      color: #333;
      padding: 4px 6px;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Zebra pattern improves readability on long lists */
    .member-item:nth-child(even) {
      background-color: #f5f5f5;
    }
  </style>
</head>
<body>
  <!--
    data-i18n attributes are read by applyI18n() in popup.js.
    Text content here acts as a fallback during initial render
    before applyI18n() runs (script is deferred).
  -->
  <h3 data-i18n="popupTitle">JamRoom</h3>

  <p id="countDisplay"
     style="color:#555; font-size:14px; font-weight:bold; margin-bottom:10px;"
     data-i18n="statusDefault">
    Not in an active room.
  </p>

  <input type="text" id="roomInput" value="room-1">

  <button id="joinBtn"  data-i18n="joinBtn">JOIN ROOM</button>
  <button id="leaveBtn" data-i18n="leaveBtn">LEAVE ROOM</button>

  <!--
    shareBtn starts hidden; updateShareVisibility(true) reveals it
    once the user joins a room. Label is managed dynamically in
    popup.js to support the "COPIED!" feedback state without a
    full applyI18n() re-run.
  -->
  <button id="shareBtn" class="hidden">SHARE ROOM</button>

  <!-- Populated by renderMemberList() in popup.js -->
  <div id="memberList"></div>

  <script src="popup.js" defer></script>
</body>
</html>
